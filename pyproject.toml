[project]
name = "fedsira"
version = "0.1.0"
requires-python = "==3.11.9"
dependencies = [
    "torch==2.9.0",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "pyarrow==17.0.0",
    "pydantic==2.9.2",
    "typer==0.12.5",
    "rich==13.9.4",
    "matplotlib==3.9.2",
    "statsmodels==0.14.4",
    "pyyaml==6.0.2",
    "duckdb==1.5.5",
]

[project.scripts]
fedsira = "fedsira.cli:app"

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
    "pyright==1.1.389",
    "vulture==2.13",
    "deptry==0.20.0",
    "import-linter==2.1",
    "pandas-stubs==2.2.3.241009",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedsira"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: fixture-based model-training integration coverage"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 16
max-branches = 16
max-returns = 16
max-statements = 80

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]
"tests/unit/domain/test_records.py" = ["B010"]
"tests/unit/config/test_loading.py" = ["B010"]
"tests/unit/artifacts/test_records.py" = ["B010"]
"src/fedsira/cli.py" = ["B008"]
"src/fedsira/datasets/nbaiot/cells.py" = ["C901", "PLR0911", "PLR0912", "PLR0915"]
"src/fedsira/datasets/nbaiot/cell_support.py" = ["C901", "PLR0911", "PLR0912", "PLR0915"]
"src/fedsira/datasets/nbaiot/baselines/outcomes.py" = ["C901", "PLR0911", "PLR0912", "PLR0915"]
"src/fedsira/application.py" = ["C901", "PLR0912", "PLR0915"]
"src/fedsira/datasets/nbaiot/executor.py" = ["C901", "PLR0911", "PLR0912", "PLR0915"]
"src/fedsira/reporting/export.py" = ["C901", "PLR0912", "PLR0915"]
"src/fedsira/reporting/tables.py" = ["C901", "PLR0912", "PLR0915"]
"src/fedsira/reporting/figures.py" = ["C901", "PLR0912"]
"src/fedsira/evaluation/comparisons.py" = ["C901", "PLR0912", "PLR0915"]
"src/fedsira/datasets/nbaiot/prepare.py" = ["C901", "PLR0915"]
"src/fedsira/datasets/ciciot2023/prepare.py" = ["C901", "PLR0912", "PLR0915"]

[tool.vulture]
ignore_decorators = ["@model_validator", "@field_validator", "@app.command"]
ignore_names = ["model_config", "forward", "format"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[[tool.pyright.executionEnvironments]]
root = "src/fedsira/datasets/ciciot2023/prepare.py"
reportUnknownMemberType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/fedsira/cli.py"
reportUnknownMemberType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/fedsira/reporting/figures.py"
reportUnknownMemberType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/fedsira/runtime.py"
reportUnknownMemberType = "none"
reportAttributeAccessIssue = "none"

[[tool.pyright.executionEnvironments]]
root = "src/fedsira/learning/model.py"
reportUnknownMemberType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/fedsira/datasets/nbaiot/cell_support.py"
reportUnusedFunction = "none"

[[tool.pyright.executionEnvironments]]
root = "src/fedsira/datasets/nbaiot/executor.py"
reportPrivateUsage = "none"

[[tool.pyright.executionEnvironments]]
root = "src/fedsira/datasets/nbaiot/cells.py"
reportUnknownMemberType = "none"
reportAttributeAccessIssue = "none"
reportPrivateUsage = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/fedsira/evaluation/standard.py"
reportMissingTypeStubs = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/fedsira/evaluation/metrics.py"
reportMissingTypeStubs = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/fedsira/evaluation/statistics.py"
reportMissingTypeStubs = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/fedsira/reporting/export.py"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "tests/unit/datasets/nbaiot/test_preprocessing.py"
reportUnknownMemberType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/fedsira/datasets/nbaiot/baselines/outcomes.py"
reportUnknownMemberType = "none"
reportAttributeAccessIssue = "none"
reportPrivateUsage = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[tool.deptry]
known_first_party = ["fedsira"]

[tool.deptry.per_rule_ignores]
DEP002 = ["pyarrow", "matplotlib", "statsmodels", "scikit-learn", "torch", "numpy", "pandas", "scipy"]

[tool.importlinter]
root_package = "fedsira"

[[tool.importlinter.contracts]]
name = "domain has no application/execution dependencies"
type = "forbidden"
source_modules = ["fedsira.domain"]
forbidden_modules = [
    "fedsira.cli",
    "fedsira.reporting",
    "fedsira.runtime",
    "fedsira.artifacts",
    "fedsira.experiments",
    "fedsira.config",
]

[[tool.importlinter.contracts]]
name = "config has no application/execution dependencies"
type = "forbidden"
source_modules = ["fedsira.config"]
forbidden_modules = [
    "fedsira.cli",
    "fedsira.reporting",
    "fedsira.runtime",
    "fedsira.artifacts",
    "fedsira.experiments",
]

[[tool.importlinter.contracts]]
name = "cli stays thin: no scientific/artifact logic implemented in cli"
type = "forbidden"
source_modules = ["fedsira.cli"]
forbidden_modules = [
    "fedsira.learning",
    "fedsira.protocol",
    "fedsira.analysis",
]
allow_indirect_imports = true
