name: attack-transform-removal

on:
  push:
    branches:
      - refactor/roadmap-completion
    paths:
      - .github/workflows/attack-transform-removal.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - name: Move capability fixture and delete transform module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('src/fedsira/boundaries/capability_granularity.py')
          text = target.read_text()
          text = text.replace('import hashlib\n', 'import hashlib\nfrom collections.abc import Sequence\n')
          text = text.replace('from fedsira.domain.enums import CapabilityContractScope, RootCause\n', 'from fedsira.domain.enums import CapabilityContractScope, RootCause, SeedNamespace\n')
          text = text.replace('    SampleId,\n', '    NamespaceSeed,\n    SampleId,\n')
          function = '''\n\ndef balanced_capability_selection(\n    root_cause_a_row_ids: Sequence[SampleId],\n    root_cause_b_row_ids: Sequence[SampleId],\n    attack_generation_namespace_seed: NamespaceSeed,\n) -> tuple[tuple[SampleId, ...], tuple[SampleId, ...]]:\n    selected_count = min(len(root_cause_a_row_ids), len(root_cause_b_row_ids))\n    separator = SeedNamespace.ATTACK_GENERATION.value\n    ordered_a = deterministic_order(\n        root_cause_a_row_ids, separator, attack_generation_namespace_seed\n    )\n    ordered_b = deterministic_order(\n        root_cause_b_row_ids, separator, attack_generation_namespace_seed\n    )\n    return ordered_a[:selected_count], ordered_b[:selected_count]\n'''
          if 'def balanced_capability_selection(' not in text:
              text += function
          text = text.replace('from fedsira.runtime.determinism import framed_bytes\n', 'from fedsira.runtime.determinism import deterministic_order, framed_bytes\n')
          target.write_text(text)

          for path in Path('src').rglob('*.py'):
              source = path.read_text()
              source = source.replace(
                  'from fedsira.attacks.transform import balanced_50_50_selection',
                  'from fedsira.boundaries.capability_granularity import balanced_capability_selection',
              )
              source = source.replace('balanced_50_50_selection(', 'balanced_capability_selection(')
              path.write_text(source)

          test_source = Path('tests/unit/attacks/test_transform.py')
          if test_source.exists():
              source = test_source.read_text().replace(
                  'from fedsira.attacks.transform import balanced_50_50_selection',
                  'from fedsira.boundaries.capability_granularity import balanced_capability_selection',
              ).replace('balanced_50_50_selection(', 'balanced_capability_selection(')
              destination = Path('tests/unit/boundaries/test_capability_balancing.py')
              destination.write_text(source)
              test_source.unlink()

          obsolete = Path('src/fedsira/attacks/transform.py')
          if obsolete.exists():
              obsolete.unlink()

          remaining = []
          for root in (Path('src'), Path('tests')):
              for path in root.rglob('*.py'):
                  if 'fedsira.attacks.transform' in path.read_text():
                      remaining.append(str(path))
          if remaining:
              raise SystemExit(f'obsolete transform imports remain: {remaining}')
          PY
          uv run ruff check src/fedsira/boundaries/capability_granularity.py src/fedsira/experiments/real_evidence.py tests/unit/boundaries/test_capability_balancing.py --fix || true
          uv run ruff format src/fedsira/boundaries/capability_granularity.py src/fedsira/experiments/real_evidence.py tests/unit/boundaries/test_capability_balancing.py
          uv run pytest tests/unit/boundaries/test_capability_balancing.py -q
          rm .github/workflows/attack-transform-removal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove generic attack transform module'
          git push origin HEAD:refactor/roadmap-completion
