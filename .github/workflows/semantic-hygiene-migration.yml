name: semantic-hygiene-migration

on:
  push:
    branches:
      - refactor/roadmap-completion
    paths:
      - .github/workflows/semantic-hygiene-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - name: Apply semantic hygiene fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/fedsira/datasets/nbaiot/preprocessing.py')
          text = path.read_text()
          old = 'from fedsira.domain.records import ArtifactDigest, DatasetColumnName, NonNegativeInt\n'
          new = 'from fedsira.domain.records import (\n    ArtifactDigest,\n    DatasetClassToken,\n    DatasetColumnName,\n    NonNegativeInt,\n)\n'
          if old in text:
              path.write_text(text.replace(old, new))
          elif 'DatasetClassToken,' not in text:
              raise SystemExit('unable to establish N-BaIoT DatasetClassToken import')

          path = Path('src/fedsira/protocol/opening.py')
          text = path.read_text().replace('    CandidateFreeOpeningPredicate,\n', '')
          path.write_text(text)
          PY
          uv run ruff check . --fix || true
          uv run ruff format .
          rm -f roadmap-diagnostics.txt
          rm .github/workflows/semantic-hygiene-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: normalize semantic typing hygiene'
          git push origin HEAD:refactor/roadmap-completion
