name: quality-cleanup-migration

on:
  push:
    branches:
      - refactor/roadmap-completion
    paths:
      - .github/workflows/quality-cleanup-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
      - name: Apply narrow quality cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/fedsira/datasets/nbaiot/preprocessing.py")
          text = path.read_text()
          old = '''    (scaler_root / "nbaiot_scaler.json").write_text(\n        _stable_json(scaler_payload), encoding="utf-8"\n    )'''
          new = '''    (scaler_root / "nbaiot_scaler.json").write_text(_stable_json(scaler_payload), encoding="utf-8")'''
          if old not in text:
              raise SystemExit("expected scaler formatting source not found")
          path.write_text(text.replace(old, new, 1))

          path = Path("tests/architecture/test_no_todos_or_temporary_code.py")
          text = path.read_text()
          old = '    source = "def unfinished() -> None:\\n    pass\\n\\ndef unsupported() -> None:\\n    raise NotImplementedError\\n"'
          new = '''    source = (\n        "def unfinished() -> None:\\n    pass\\n\\n"\n        "def unsupported() -> None:\\n    raise NotImplementedError\\n"\n    )'''
          if old not in text:
              raise SystemExit("expected architecture test line not found")
          path.write_text(text.replace(old, new, 1))

          path = Path("tests/unit/datasets/nbaiot/test_preprocessing.py")
          text = path.read_text()
          text = text.replace("from pathlib import Path\n", "from pathlib import Path\nfrom typing import cast\n", 1)
          text = text.replace(
              "    assign_stream_roles_and_sample_ids,\n    materialize_nbaiot_prepared_views,\n    classify_row_finiteness,",
              "    assign_stream_roles_and_sample_ids,\n    classify_row_finiteness,\n    materialize_nbaiot_prepared_views,",
              1,
          )
          old = '''    assert tuple(str(value) for value in frame["sample_id"]) == view.sample_ids\n    assert tuple(str(value) for value in frame["label"]) == view.labels'''
          new = '''    sample_ids = cast(pandas.Series[str], frame["sample_id"])\n    labels = cast(pandas.Series[str], frame["label"])\n    assert tuple(sample_ids) == view.sample_ids\n    assert tuple(labels) == view.labels'''
          if old not in text:
              raise SystemExit("expected parquet assertion block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fedsira/datasets/nbaiot/preprocessing.py tests/architecture/test_no_todos_or_temporary_code.py tests/unit/datasets/nbaiot/test_preprocessing.py
          git commit -m "Clear post-migration quality blockers"
          git push origin HEAD:refactor/roadmap-completion
