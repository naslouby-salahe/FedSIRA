name: proposal-screen-migration

on:
  push:
    branches:
      - refactor/roadmap-completion

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Fold proposal screening into claim opening'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Migrate proposal screen ownership
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          for path in Path('.').rglob('*.py'):
              if '.venv' in path.parts:
                  continue
              text = path.read_text()
              updated = text.replace('fedsira.evaluation.screen', 'fedsira.protocol.opening')
              if updated != text:
                  path.write_text(updated)

          real_evidence = Path('src/fedsira/experiments/real_evidence.py')
          text = real_evidence.read_text()
          text = text.replace(
              'ScreenLossObservation(\n                sample_id, float(target_anchor_loss[index]), float(target_source_loss[index])\n            )',
              'ScreenLossObservation(\n                sample_id=sample_id,\n                anchor_loss=float(target_anchor_loss[index]),\n                source_loss=float(target_source_loss[index]),\n            )',
          )
          text = text.replace(
              'ScreenLossObservation(\n                sample_id, float(control_anchor_loss[index]), float(control_source_loss[index])\n            )',
              'ScreenLossObservation(\n                sample_id=sample_id,\n                anchor_loss=float(control_anchor_loss[index]),\n                source_loss=float(control_source_loss[index]),\n            )',
          )
          real_evidence.write_text(text)

          old_test = Path('tests/unit/evaluation/test_screen.py')
          new_test = Path('tests/unit/protocol/test_screen.py')
          text = old_test.read_text()
          text = re.sub(
              r'ScreenLossObservation\(([^,\n]+),\s*anchor_loss=',
              r'ScreenLossObservation(sample_id=\1, anchor_loss=',
              text,
          )
          new_test.write_text(text)
          old_test.unlink()
          Path('src/fedsira/evaluation/screen.py').unlink(missing_ok=True)
          PY
          python -m pip install --quiet ruff==0.7.4
          ruff format src/fedsira/experiments/real_evidence.py src/fedsira/experiments/protocol_executor.py tests/unit/protocol/test_screen.py
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fold proposal screening into claim opening'
          git pull --rebase origin refactor/roadmap-completion
          git push origin HEAD:refactor/roadmap-completion
