name: statistics-layer-migration

on:
  push:
    branches:
      - refactor/roadmap-completion

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Complete analysis statistics ownership migration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Move statistics ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path('.').rglob('*.py'):
              if '.venv' in path.parts:
                  continue
              text = path.read_text()
              updated = text.replace('fedsira.evaluation.statistics', 'fedsira.analysis.statistics')
              if updated != text:
                  path.write_text(updated)
          old_test = Path('tests/unit/evaluation/test_statistics.py')
          new_test = Path('tests/unit/analysis/test_statistics.py')
          if old_test.exists():
              new_test.write_text(old_test.read_text())
              old_test.unlink()
          Path('src/fedsira/evaluation/statistics.py').unlink(missing_ok=True)
          PY
          python -m pip install --quiet ruff==0.7.4
          ruff format src/fedsira/analysis/statistics.py src/fedsira/analysis/comparisons.py src/fedsira/artifacts/fingerprints.py src/fedsira/experiments/smoke.py tests/unit/analysis/test_statistics.py
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete analysis statistics ownership migration'
          git pull --rebase origin refactor/roadmap-completion
          git push origin HEAD:refactor/roadmap-completion
