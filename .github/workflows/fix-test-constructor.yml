name: fix-test-constructor

on:
  push:
    branches:
      - refactor/roadmap-completion

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Fix executor constructor migration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups --frozen
      - name: Repair constructor names
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/experiments/test_protocol_executor_real_evidence.py')
          text = path.read_text()
          text = text.replace('primary_primary_prepared_root', 'primary_prepared_root')
          path.write_text(text)
          PY
          uv run ruff format tests/integration/experiments/test_protocol_executor_real_evidence.py
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/experiments/test_protocol_executor_real_evidence.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix executor constructor migration'
          git push origin HEAD:refactor/roadmap-completion
