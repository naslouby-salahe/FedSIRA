name: refactor-diagnostics

on:
  push:
    branches:
      - refactor/roadmap-completion
    paths-ignore:
      - ci-diagnostics.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          : > ci-diagnostics.txt
          for command in \
            "uv run ruff format --check ." \
            "uv run ruff check ." \
            "uv run pyright" \
            "uv run lint-imports" \
            "uv run pytest tests/architecture -x -q" \
            "uv run deptry src" \
            "uv run pytest tests -x -q"; do
            printf '\n===== %s =====\n' "$command" >> ci-diagnostics.txt
            bash -lc "$command" >> ci-diagnostics.txt 2>&1
            printf '\nexit=%s\n' "$?" >> ci-diagnostics.txt
          done
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture refactor diagnostics"
            git push
          fi
