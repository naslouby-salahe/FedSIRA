name: execution-semantic-contracts

on:
  push:
    branches: [refactor/roadmap-completion]
    paths: [.github/workflows/execution-semantic-contracts.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups --frozen
      - name: Type execution contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          records = Path('src/fedsira/domain/records.py')
          text = records.read_text()
          if 'ExecutionSchemaVersion = SchemaVersion' not in text:
              text = text.replace('SchemaVersion = TextValue\n', 'SchemaVersion = TextValue\nExecutionSchemaVersion = SchemaVersion\n', 1)
          if 'OverwriteExisting = BooleanValue' not in text:
              text = text.replace(
                  'ArtifactInvalidated = BooleanValue\n',
                  'ArtifactInvalidated = BooleanValue\nOverwriteExisting = BooleanValue\nCellCompletionStatus = BooleanValue\nTerminalExperimentState = BooleanValue\n',
                  1,
              )
          if 'MetricObservation: TypeAlias' not in text:
              text = text.replace(
                  'PredictorValue = FiniteFloat\n',
                  'PredictorValue = FiniteFloat\nMetricObservation: TypeAlias = tuple[MetricName, MetricValue | None]\n',
                  1,
              )
          records.write_text(text)

          comparisons = Path('src/fedsira/analysis/comparisons.py')
          text = comparisons.read_text()
          if 'INCONCLUSIVE_TECHNICAL' not in text:
              text = text.replace(
                  '    FAILED = "Failed"\n',
                  '    FAILED = "Failed"\n    INCONCLUSIVE_TECHNICAL = "Inconclusive Technical"\n',
                  1,
              )
          comparisons.write_text(text)

          path = Path('src/fedsira/experiments/execution.py')
          text = path.read_text()
          text = text.replace('import pydantic\n\n', '')
          text = text.replace(
              '    ComparisonResult,\n',
              '    ComparisonResult,\n    ComparisonState,\n',
              1,
          )
          text = text.replace(
              'from fedsira.domain.records import ArtifactDigest, CanonicalToken, MasterSeed',
              '''from fedsira.domain.records import (\n    ArtifactDigest,\n    CellCompletionStatus,\n    CollapseDecisionPassed,\n    CompleteSeedCount,\n    ExecutionSchemaVersion,\n    ExperimentName,\n    FailureMessage,\n    FrozenDomainModel,\n    MasterSeed,\n    MethodName,\n    MetricName,\n    MetricObservation,\n    MetricValue,\n    OverwriteExisting,\n    PairedDifference,\n    ResolvedCoreComplete,\n    ScientificCellCount,\n    ScientificCellSemanticKey,\n    ScenarioName,\n    TerminalExperimentState,\n)''',
          )
          text = text.replace(
              'EXECUTION_RECORD_SCHEMA_VERSION = "fedsira|execution_record|1"',
              'EXECUTION_RECORD_SCHEMA_VERSION: ExecutionSchemaVersion = "fedsira|execution_record|1"',
          )
          text = text.replace('class PersistedFailureDetail(pydantic.BaseModel):\n    model_config = pydantic.ConfigDict(frozen=True, extra="forbid")\n\n', 'class PersistedFailureDetail(FrozenDomainModel):\n')
          text = text.replace('class PersistedExecutionRecord(pydantic.BaseModel):\n    model_config = pydantic.ConfigDict(frozen=True, extra="forbid")\n\n', 'class PersistedExecutionRecord(FrozenDomainModel):\n')
          replacements = {
              'message: CanonicalToken': 'message: FailureMessage',
              'schema_version: str': 'schema_version: ExecutionSchemaVersion',
              'semantic_key: CanonicalToken': 'semantic_key: ScientificCellSemanticKey',
              'experiment: CanonicalToken': 'experiment: ExperimentName',
              'method: CanonicalToken': 'method: MethodName',
              'condition: CanonicalToken': 'condition: ScenarioName',
              'terminal_state: CanonicalToken': 'terminal_state: ExperimentLifecycleState',
              'metrics: tuple[tuple[CanonicalToken, float | None], ...]': 'metrics: tuple[MetricObservation, ...]',
              'terminal_state: str': 'terminal_state: ExperimentLifecycleState',
              'def completed(self) -> bool:': 'def completed(self) -> CellCompletionStatus:',
              'experiment: CanonicalToken\n': 'experiment: ExperimentName\n',
              'execution_digest: ArtifactDigest = ""': 'execution_digest: ArtifactDigest | None = None',
              'def cell_completion_count(self) -> int:': 'def cell_completion_count(self) -> ScientificCellCount:',
              'def _record_directory(self, experiment: CanonicalToken)': 'def _record_directory(self, experiment: ExperimentName)',
              'self, experiment: CanonicalToken, semantic_key: CanonicalToken': 'self, experiment: ExperimentName, semantic_key: ScientificCellSemanticKey',
              'def read_all_outcomes(self, experiment: CanonicalToken)': 'def read_all_outcomes(self, experiment: ExperimentName)',
              '    experiment: CanonicalToken,\n': '    experiment: ExperimentName,\n',
              'dict[tuple[PairingKey, CanonicalToken], dict[CanonicalToken, float | None]]': 'dict[tuple[PairingKey, MethodName], dict[MetricName, MetricValue | None]]',
              'paired: list[float]': 'paired: list[PairedDifference]',
              'complete_seeds = 0': 'complete_seeds: CompleteSeedCount = 0',
              'dict[MasterSeed, dict[CanonicalToken, float | None]]': 'dict[MasterSeed, dict[MethodName, MetricValue | None]]',
              'comparison_state="Inconclusive Technical"': 'comparison_state=ComparisonState.INCONCLUSIVE_TECHNICAL',
              '    overwrite: bool = False,': '    overwrite: OverwriteExisting = False,',
              '    resolved_core_complete: bool = False,': '    resolved_core_complete: ResolvedCoreComplete = False,',
              'collapse_decision_states: Sequence[tuple[CanonicalToken, bool]] | None = None,': 'collapse_decision_states: Sequence[tuple[ExperimentName, CollapseDecisionPassed]] | None = None,',
              'prerequisite_states: dict[CanonicalToken, ExperimentLifecycleState]': 'prerequisite_states: dict[ExperimentName, ExperimentLifecycleState]',
              'def derive_lifecycle_state(terminal_states: Sequence[str])': 'def derive_lifecycle_state(terminal_states: Sequence[ExperimentLifecycleState])',
              'def is_terminal_experiment_state(state: ExperimentLifecycleState) -> bool:': 'def is_terminal_experiment_state(\n    state: ExperimentLifecycleState,\n) -> TerminalExperimentState:',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          text = text.replace('self.terminal_state == ExperimentLifecycleState.COMPLETED.value', 'self.terminal_state is ExperimentLifecycleState.COMPLETED')
          text = text.replace('outcome.terminal_state == ExperimentLifecycleState.COMPLETED.value', 'outcome.terminal_state is ExperimentLifecycleState.COMPLETED')
          text = text.replace('invalid_state = ExperimentLifecycleState.INVALID.value', 'invalid_state = ExperimentLifecycleState.INVALID')
          text = text.replace('failed_state = ExperimentLifecycleState.FAILED.value', 'failed_state = ExperimentLifecycleState.FAILED')
          text = text.replace('completed_state = ExperimentLifecycleState.COMPLETED.value', 'completed_state = ExperimentLifecycleState.COMPLETED')
          text = text.replace('framed_bytes(outcome.cell.semantic_key, outcome.terminal_state)', 'framed_bytes(outcome.cell.semantic_key, outcome.terminal_state.value)')
          path.write_text(text)

          # Terminal states are a closed finite domain everywhere, including executors/tests.
          pattern = re.compile(r'(terminal_state\s*=\s*ExperimentLifecycleState\.[A-Z_]+)\.value')
          equality_pattern = re.compile(r'(terminal_state\s*==\s*ExperimentLifecycleState\.[A-Z_]+)\.value')
          for root in (Path('src'), Path('tests')):
              for candidate in root.rglob('*.py'):
                  content = candidate.read_text()
                  content = pattern.sub(r'\1', content)
                  content = equality_pattern.sub(r'\1', content)
                  candidate.write_text(content)
          PY
          uv run ruff format src tests
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          git commit -m "refactor: type experiment execution semantics"
          git push
