name: communication-layer-migration

on:
  push:
    branches:
      - refactor/roadmap-completion
    paths:
      - .github/workflows/communication-layer-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - name: Remove duplicate communication module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for root in (Path('src'), Path('tests')):
              for path in root.rglob('*.py'):
                  source = path.read_text()
                  source = source.replace(
                      'from fedsira.evaluation.communication import (',
                      'from fedsira.evaluation.records import (',
                  )
                  source = source.replace('SERVER_TOKEN', 'SERVER_ID')
                  source = source.replace(
                      'canonical_parameter_tensor_name',
                      'parameter_tensor_name',
                  )
                  path.write_text(source)

          obsolete = Path('src/fedsira/evaluation/communication.py')
          if obsolete.exists():
              obsolete.unlink()
          PY
          uv run ruff check src tests/unit/evaluation/test_communication.py --fix || true
          uv run ruff format src tests/unit/evaluation/test_communication.py
          rm .github/workflows/communication-layer-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove duplicate communication module'
          git push origin HEAD:refactor/roadmap-completion
