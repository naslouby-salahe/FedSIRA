name: semantic-foundation-migration-v2

on:
  push:
    branches: [refactor/roadmap-completion]
    paths: [.github/workflows/semantic-foundation-migration-v2.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups --frozen
      - name: Apply semantic contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, *pairs: tuple[str, str]) -> None:
              target = Path(path)
              text = target.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              target.write_text(text)

          records = Path('src/fedsira/domain/records.py')
          text = records.read_text().replace(
              'FeatureShiftSign: TypeAlias = Literal[-1.0, 1.0]',
              'FeatureShiftSign: TypeAlias = Literal[-1, 1]',
          )
          additions = {
              'ReproductionRowId = TextValue\n': '''ReproductionRowId = TextValue\nScientificCellSemanticKey = TextValue\nCellPhaseIdentity = TextValue\nRuntimeComponentName = TextValue\nScientificConfigurationSubset = TextValue\nEnvironmentRecord = TextValue\nCreationContext = TextValue\nTensorName = TextValue\nFigureName = TextValue\nTableName = TextValue\nClaimEvidenceName = TextValue\nReportVerificationFailure = TextValue\nPreparedViewKey = TextValue\nRoleHashToken = TextValue\n''',
              'KrumNeighborCount = PositiveInt\n': '''KrumNeighborCount = PositiveInt\nSignFlipSampleCount = NonNegativeInt\nEligibleAttackRowCount = NonNegativeInt\n''',
              'FeatureShiftMagnitude = PositiveFloat\n': '''FeatureShiftMagnitude = PositiveFloat\nTrainingLoss = NonNegativeFloat\nMetricValue = FiniteFloat\nPredictorValue = FiniteFloat\n''',
              'KrumCommitteeAdmissible = BooleanValue\n': '''KrumCommitteeAdmissible = BooleanValue\nBaselineFullParticipationAllowed = BooleanValue\nFinalGateArtifactValid = BooleanValue\nPluralityActive = BooleanValue\nInvariantChecksPassed = BooleanValue\nAttackCarrierRequired = BooleanValue\nScreenDomainDecision = BooleanValue\nCandidateFreeOpeningPredicate = BooleanValue\nResolvedCoreComplete = BooleanValue\nCollapseDecisionPassed = BooleanValue\nResolvedCoreDependent = BooleanValue\nProvenancePayloadStale = BooleanValue\nScientificConfigurationChanged = BooleanValue\nDatasetSplitUpstreamChanged = BooleanValue\nProducerCodeOrRuntimeChanged = BooleanValue\nArtifactInvalidated = BooleanValue\n''',
          }
          sentinels = {
              'ReproductionRowId = TextValue\n': 'ScientificCellSemanticKey = TextValue',
              'KrumNeighborCount = PositiveInt\n': 'SignFlipSampleCount = NonNegativeInt',
              'FeatureShiftMagnitude = PositiveFloat\n': 'TrainingLoss = NonNegativeFloat',
              'KrumCommitteeAdmissible = BooleanValue\n': 'BaselineFullParticipationAllowed = BooleanValue',
          }
          for anchor, addition in additions.items():
              if sentinels[anchor] not in text:
                  text = text.replace(anchor, addition, 1)
          records.write_text(text)

          for root in (Path('src'), Path('tests')):
              for path in root.rglob('*.py'):
                  content = path.read_text()
                  for old, new in {
                      'canonical_bytes': 'framed_bytes',
                      'ROW_IDENTIFIER_CANONICAL_TOKENS': 'ROW_IDENTIFIER_TOKENS',
                      'canonical_class_registry': 'build_class_registry',
                      'canonicalize_label': 'normalize_label',
                      'canonicalize_token': 'normalize_label_token',
                      'ArtifactFamily.CANONICAL_DATASET_MANIFEST': 'ArtifactFamily.DATASET_MANIFEST',
                  }.items():
                      content = content.replace(old, new)
                  path.write_text(content)

          Path('src/fedsira/analysis/statistics.py').write_text('''import itertools\nfrom collections.abc import Sequence\n\nfrom fedsira.domain.records import (\n    ComparisonMargin,\n    ComparisonName,\n    PValue,\n    PairedDifference,\n    SignFlipSampleCount,\n)\n\n\ndef enumerate_sign_flip_assignments(\n    sample_count: SignFlipSampleCount,\n) -> tuple[tuple[int, ...], ...]:\n    return tuple(itertools.product((1, -1), repeat=sample_count))\n\n\ndef _signed_mean(\n    signs: Sequence[int], differences: Sequence[PairedDifference]\n) -> PairedDifference:\n    paired = zip(signs, differences, strict=True)\n    return sum(sign * difference for sign, difference in paired) / len(differences)\n\n\ndef exact_sign_flip_two_sided_p_value(\n    paired_differences: Sequence[PairedDifference],\n) -> PValue:\n    sample_count = len(paired_differences)\n    observed_absolute_mean = abs(sum(paired_differences) / sample_count)\n    assignments = enumerate_sign_flip_assignments(sample_count)\n    extreme_count = sum(\n        1\n        for signs in assignments\n        if abs(_signed_mean(signs, paired_differences)) >= observed_absolute_mean\n    )\n    return extreme_count / len(assignments)\n\n\ndef exact_sign_flip_non_inferiority_p_value(\n    paired_differences: Sequence[PairedDifference],\n    margin: ComparisonMargin,\n) -> PValue:\n    shifted_differences = [difference + margin for difference in paired_differences]\n    sample_count = len(shifted_differences)\n    observed_mean = sum(shifted_differences) / sample_count\n    assignments = enumerate_sign_flip_assignments(sample_count)\n    extreme_count = sum(\n        1\n        for signs in assignments\n        if _signed_mean(signs, shifted_differences) >= observed_mean\n    )\n    return extreme_count / len(assignments)\n\n\ndef holm_adjusted_p_values(\n    named_raw_p_values: Sequence[tuple[ComparisonName, PValue]],\n) -> tuple[tuple[ComparisonName, PValue], ...]:\n    ordered = sorted(named_raw_p_values, key=lambda item: (item[1], item[0]))\n    comparison_count = len(ordered)\n    adjusted_p_values: list[PValue] = []\n    running_maximum: PValue = 0.0\n    for rank, (_, raw_p_value) in enumerate(ordered):\n        candidate = min((comparison_count - rank) * raw_p_value, 1.0)\n        running_maximum = max(running_maximum, candidate)\n        adjusted_p_values.append(running_maximum)\n    return tuple(\n        (name, adjusted)\n        for (name, _), adjusted in zip(ordered, adjusted_p_values, strict=True)\n    )\n''')

          replace(
              'src/fedsira/artifacts/paths.py',
              ('from fedsira.domain.enums import ArtifactFamily, ArtifactPathScope', 'from fedsira.domain.enums import ArtifactFamily, ArtifactPathScope, DatasetId'),
              ('from fedsira.domain.records import CanonicalToken, ExperimentName', 'from fedsira.domain.records import ExperimentName'),
              ('def prepared_evidence_root(dataset: CanonicalToken) -> Path:', 'def prepared_evidence_root(dataset: DatasetId) -> Path:'),
          )

          for path, semantic in {
              'src/fedsira/attacks/transform.py': 'SampleId',
              'src/fedsira/evaluation/aggregation.py': 'SampleId',
              'src/fedsira/evaluation/metrics.py': 'DatasetClassToken',
              'src/fedsira/evaluation/validation.py': 'DatasetClassToken',
              'src/fedsira/learning/anchor.py': 'SampleId',
              'src/fedsira/learning/federated.py': 'SampleId',
              'src/fedsira/learning/training.py': 'SampleId',
              'src/fedsira/learning/post_reference.py': 'SampleId',
              'src/fedsira/experiments/registry.py': 'ExperimentName',
              'src/fedsira/runtime/environment.py': 'EnvironmentText',
              'src/fedsira/runtime/logging.py': 'RuntimeComponentName',
          }.items():
              replace(path, ('CanonicalToken', semantic))

          replace(
              'src/fedsira/baselines/registry.py',
              ('BooleanFlag', 'BaselineFullParticipationAllowed'),
          )

          opening = Path('src/fedsira/protocol/opening.py')
          content = opening.read_text()
          content = content.replace(
              '    BooleanFlag,\n    CanonicalToken,',
              '    AttackCarrierRequired,\n    CandidateFreeOpeningPredicate,\n    SampleId,\n    ScreenDomainDecision,',
          )
          content = content.replace('sample_id: CanonicalToken', 'sample_id: SampleId')
          content = content.replace('Mapping[CanonicalToken, FoldIndex]', 'Mapping[SampleId, FoldIndex]')
          content = content.replace('requires_attack_carrier: BooleanFlag', 'requires_attack_carrier: AttackCarrierRequired')
          content = content.replace(') -> BooleanFlag:', ') -> ScreenDomainDecision:')
          content = content.replace(
              ') -> ScreenDomainDecision:\n    return anchor_target_f1.state',
              ') -> CandidateFreeOpeningPredicate:\n    return anchor_target_f1.state',
              1,
          )
          opening.write_text(content)

          admission = Path('src/fedsira/protocol/admission.py')
          content = admission.read_text()
          content = content.replace(
              '    BooleanFlag,\n    CanonicalToken,',
              '    CellPhaseIdentity,\n    FinalGateArtifactValid,\n    GitCommit,\n    InvariantChecksPassed,\n    PluralityActive,\n    ScientificCellSemanticKey,',
          )
          for old, new in {
              'final_gate_artifact_is_valid: BooleanFlag': 'final_gate_artifact_is_valid: FinalGateArtifactValid',
              'is_plurality_active: BooleanFlag': 'is_plurality_active: PluralityActive',
              'no_invariant_failure: BooleanFlag': 'no_invariant_failure: InvariantChecksPassed',
              'semantic_cell_key: CanonicalToken': 'semantic_cell_key: ScientificCellSemanticKey',
              'cell_phase_identity: CanonicalToken': 'cell_phase_identity: CellPhaseIdentity',
              'repository_commit: CanonicalToken': 'repository_commit: GitCommit',
          }.items():
              content = content.replace(old, new)
          admission.write_text(content)

          Path('src/fedsira/artifacts/provenance.py').write_text('''from fedsira.domain.enums import ProvenanceValidationOutcome\nfrom fedsira.domain.records import (\n    ArtifactDigest,\n    ArtifactInvalidated,\n    CreationContext,\n    DatasetSplitUpstreamChanged,\n    EnvironmentRecord,\n    FrozenDomainModel,\n    GitCommit,\n    ProducerCodeOrRuntimeChanged,\n    ProvenancePayloadStale,\n    ScientificConfigurationChanged,\n    ScientificConfigurationSubset,\n)\n\n\nclass ProvenanceRecord(FrozenDomainModel):\n    scientific_configuration_subset: ScientificConfigurationSubset\n    dataset_split_upstream_identities: tuple[ArtifactDigest, ...]\n    producer_component_fingerprint: ArtifactDigest\n    external_dependency_fingerprint: ArtifactDigest\n    repository_commit: GitCommit\n    dependency_lock_identity: ArtifactDigest\n    environment_record: EnvironmentRecord\n    creation_context: CreationContext\n\n\ndef classify_provenance_change(\n    payload_partial_or_stale: ProvenancePayloadStale,\n    scientific_configuration_changed: ScientificConfigurationChanged,\n    dataset_split_upstream_changed: DatasetSplitUpstreamChanged,\n    producer_code_or_runtime_changed: ProducerCodeOrRuntimeChanged,\n) -> ProvenanceValidationOutcome:\n    if payload_partial_or_stale:\n        return ProvenanceValidationOutcome.PARTIAL_OR_STALE_PAYLOAD\n    if scientific_configuration_changed:\n        return ProvenanceValidationOutcome.SCIENTIFIC_CONFIGURATION_MISMATCH\n    if dataset_split_upstream_changed:\n        return ProvenanceValidationOutcome.DATASET_SPLIT_UPSTREAM_MISMATCH\n    if producer_code_or_runtime_changed:\n        return ProvenanceValidationOutcome.PRODUCER_CODE_RUNTIME_MISMATCH\n    return ProvenanceValidationOutcome.NON_MATERIAL_CHANGE\n\n\ndef outcome_invalidates_artifact(\n    outcome: ProvenanceValidationOutcome,\n) -> ArtifactInvalidated:\n    return outcome is not ProvenanceValidationOutcome.NON_MATERIAL_CHANGE\n''')

          cic = Path('src/fedsira/datasets/ciciot2023/preprocessing.py')
          content = cic.read_text()
          content = content.replace(
              'from fedsira.domain.records import ArtifactDigest, CanonicalToken, NonNegativeInt, PositiveInt',
              'from fedsira.domain.records import (\n    ArtifactDigest,\n    DatasetClassToken,\n    DatasetColumnName,\n    NonNegativeInt,\n    PositiveInt,\n    PredictorCountMatchesOfficial,\n    PredictorValue,\n    PreparedViewKey,\n    RelativePathText,\n    RoleHashToken,\n)',
          )
          for old, new in {
              'relative_path: CanonicalToken': 'relative_path: RelativePathText',
              'canonical_label: CanonicalToken': 'canonical_label: DatasetClassToken',
              'class_registry: tuple[CanonicalToken, ...]': 'class_registry: tuple[DatasetClassToken, ...]',
              'predictor_columns: tuple[CanonicalToken, ...]': 'predictor_columns: tuple[DatasetColumnName, ...]',
              'predictor_count_matches_official: bool': 'predictor_count_matches_official: PredictorCountMatchesOfficial',
              'features: tuple[float, ...]': 'features: tuple[PredictorValue, ...]',
              'normalized_relative_csv_path: CanonicalToken': 'normalized_relative_csv_path: RelativePathText',
              'header: tuple[CanonicalToken, ...]': 'header: tuple[DatasetColumnName, ...]',
              'label_column: CanonicalToken': 'label_column: DatasetColumnName',
              'row_identifier_columns: frozenset[CanonicalToken]': 'row_identifier_columns: frozenset[DatasetColumnName]',
              'tuple[CanonicalToken, CICIoT2023PseudoDomain]': 'tuple[DatasetClassToken, CICIoT2023PseudoDomain]',
              'set[CanonicalToken]': 'set[DatasetClassToken]',
              ') -> frozenset[CanonicalToken]:': ') -> frozenset[DatasetColumnName]:',
              'identifiers: set[CanonicalToken]': 'identifiers: set[DatasetColumnName]',
              ') -> CanonicalToken:\n    return f"{pseudo_domain.display_token}_{canonical_label}_{ROLE_HASH_TOKEN[role]}"': ') -> PreparedViewKey:\n    return f"{pseudo_domain.display_token}_{canonical_label}_{ROLE_HASH_TOKEN[role]}"',
              'def _role_from_hash_token(token: CanonicalToken) -> Role:': 'def _role_from_hash_token(token: RoleHashToken) -> Role:',
              ') -> tuple[CanonicalToken, ...]:': ') -> tuple[DatasetColumnName, ...]:',
          }.items():
              content = content.replace(old, new)
          cic.write_text(content)

          nb = Path('src/fedsira/datasets/nbaiot/preprocessing.py')
          content = nb.read_text().replace('CanonicalToken,', 'DatasetColumnName,')
          marker = '    DatasetColumnName,\n'
          for name in ('DatasetClassToken', 'DomainId', 'RelativePathText'):
              if f'    {name},\n' not in content and marker in content:
                  content = content.replace(marker, marker + f'    {name},\n', 1)
          for old, new in {
              'tuple[CanonicalToken, ...]': 'tuple[DatasetColumnName, ...]',
              'view_key: CanonicalToken': 'view_key: DatasetColumnName',
              'domain_hash_token: CanonicalToken': 'domain_hash_token: DomainId',
              'normalized_relative_csv_path: CanonicalToken': 'normalized_relative_csv_path: RelativePathText',
              'list[CanonicalToken]': 'list[DatasetColumnName]',
              'labels: list[DatasetColumnName]': 'labels: list[DatasetClassToken]',
              'list[ArtifactDigest] | list[DatasetColumnName] | list[float]': 'list[ArtifactDigest] | list[DatasetClassToken] | list[float]',
          }.items():
              content = content.replace(old, new)
          nb.write_text(content)

          test_real = Path('tests/unit/experiments/test_real_evidence.py')
          if test_real.exists():
              test_real.write_text(test_real.read_text().replace('CanonicalToken', 'FeatureName'))
          PY
          uv run ruff format src tests
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          git commit -m "refactor: migrate generic tokens to semantic contracts"
          git push
