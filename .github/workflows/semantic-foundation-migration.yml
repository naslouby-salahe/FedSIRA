name: semantic-foundation-migration

on:
  push:
    branches: [refactor/roadmap-completion]
    paths: [.github/workflows/semantic-foundation-migration.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups --frozen
      - name: Migrate semantic contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path: str, replacements: list[tuple[str, str]]) -> None:
              target = Path(path)
              text = target.read_text()
              for old, new in replacements:
                  if old not in text:
                      continue
                  text = text.replace(old, new)
              target.write_text(text)

          records = Path('src/fedsira/domain/records.py')
          text = records.read_text()
          text = text.replace('FeatureShiftSign: TypeAlias = Literal[-1.0, 1.0]', 'FeatureShiftSign: TypeAlias = Literal[-1, 1]')
          anchor = 'ReproductionRowId = TextValue\n'
          semantic_text = '''ReproductionRowId = TextValue\nScientificCellSemanticKey = TextValue\nCellPhaseIdentity = TextValue\nRuntimeComponentName = TextValue\nScientificConfigurationSubset = TextValue\nEnvironmentRecord = TextValue\nCreationContext = TextValue\nTensorName = TextValue\nFigureName = TextValue\nTableName = TextValue\nClaimEvidenceName = TextValue\nReportVerificationFailure = TextValue\n'''
          if 'ScientificCellSemanticKey = TextValue' not in text:
              text = text.replace(anchor, semantic_text)
          anchor = 'KrumNeighborCount = PositiveInt\n'
          semantic_counts = '''KrumNeighborCount = PositiveInt\nSignFlipSampleCount = NonNegativeInt\nEligibleAttackRowCount = NonNegativeInt\n'''
          if 'SignFlipSampleCount = NonNegativeInt' not in text:
              text = text.replace(anchor, semantic_counts)
          anchor = 'FeatureShiftMagnitude = PositiveFloat\n'
          semantic_floats = '''FeatureShiftMagnitude = PositiveFloat\nTrainingLoss = NonNegativeFloat\nMetricValue = FiniteFloat\nPredictorValue = FiniteFloat\n'''
          if 'TrainingLoss = NonNegativeFloat' not in text:
              text = text.replace(anchor, semantic_floats)
          anchor = 'KrumCommitteeAdmissible = BooleanValue\n'
          semantic_bools = '''KrumCommitteeAdmissible = BooleanValue\nBaselineFullParticipationAllowed = BooleanValue\nFinalGateArtifactValid = BooleanValue\nPluralityActive = BooleanValue\nInvariantChecksPassed = BooleanValue\nAttackCarrierRequired = BooleanValue\nScreenDomainDecision = BooleanValue\nCandidateFreeOpeningPredicate = BooleanValue\nResolvedCoreComplete = BooleanValue\nCollapseDecisionPassed = BooleanValue\nResolvedCoreDependent = BooleanValue\nProvenancePayloadStale = BooleanValue\nScientificConfigurationChanged = BooleanValue\nDatasetSplitUpstreamChanged = BooleanValue\nProducerCodeOrRuntimeChanged = BooleanValue\nArtifactInvalidated = BooleanValue\n'''
          if 'BaselineFullParticipationAllowed = BooleanValue' not in text:
              text = text.replace(anchor, semantic_bools)
          records.write_text(text)

          # Canonical byte framing was renamed deliberately; migrate all callers, no shim.
          for root in (Path('src'), Path('tests')):
              for path in root.rglob('*.py'):
                  content = path.read_text()
                  if 'canonical_bytes' in content:
                      path.write_text(content.replace('canonical_bytes', 'framed_bytes'))

          # Canonical CICIoT2023 schema names replaced old generic names.
          for root in (Path('src'), Path('tests')):
              for path in root.rglob('*.py'):
                  content = path.read_text()
                  replacements = {
                      'ROW_IDENTIFIER_CANONICAL_TOKENS': 'ROW_IDENTIFIER_TOKENS',
                      'canonical_class_registry': 'build_class_registry',
                      'canonicalize_label': 'normalize_label',
                      'canonicalize_token': 'normalize_label_token',
                      'ArtifactFamily.CANONICAL_DATASET_MANIFEST': 'ArtifactFamily.DATASET_MANIFEST',
                  }
                  for old, new in replacements.items():
                      content = content.replace(old, new)
                  path.write_text(content)

          # Statistical identifiers and values.
          Path('src/fedsira/analysis/statistics.py').write_text('''import itertools\nfrom collections.abc import Sequence\n\nfrom fedsira.domain.records import (\n    ComparisonMargin,\n    ComparisonName,\n    PValue,\n    PairedDifference,\n    SignFlipSampleCount,\n)\n\n\ndef enumerate_sign_flip_assignments(\n    sample_count: SignFlipSampleCount,\n) -> tuple[tuple[int, ...], ...]:\n    return tuple(itertools.product((1, -1), repeat=sample_count))\n\n\ndef _signed_mean(signs: Sequence[int], differences: Sequence[PairedDifference]) -> PairedDifference:\n    paired = zip(signs, differences, strict=True)\n    return sum(sign * difference for sign, difference in paired) / len(differences)\n\n\ndef exact_sign_flip_two_sided_p_value(\n    paired_differences: Sequence[PairedDifference],\n) -> PValue:\n    sample_count = len(paired_differences)\n    observed_absolute_mean = abs(sum(paired_differences) / sample_count)\n    assignments = enumerate_sign_flip_assignments(sample_count)\n    extreme_count = sum(\n        1\n        for signs in assignments\n        if abs(_signed_mean(signs, paired_differences)) >= observed_absolute_mean\n    )\n    return extreme_count / len(assignments)\n\n\ndef exact_sign_flip_non_inferiority_p_value(\n    paired_differences: Sequence[PairedDifference],\n    margin: ComparisonMargin,\n) -> PValue:\n    shifted_differences = [difference + margin for difference in paired_differences]\n    sample_count = len(shifted_differences)\n    observed_mean = sum(shifted_differences) / sample_count\n    assignments = enumerate_sign_flip_assignments(sample_count)\n    extreme_count = sum(\n        1 for signs in assignments if _signed_mean(signs, shifted_differences) >= observed_mean\n    )\n    return extreme_count / len(assignments)\n\n\ndef holm_adjusted_p_values(\n    named_raw_p_values: Sequence[tuple[ComparisonName, PValue]],\n) -> tuple[tuple[ComparisonName, PValue], ...]:\n    ordered = sorted(named_raw_p_values, key=lambda item: (item[1], item[0]))\n    comparison_count = len(ordered)\n    adjusted_p_values: list[PValue] = []\n    running_maximum: PValue = 0.0\n    for rank, (_, raw_p_value) in enumerate(ordered):\n        candidate = min((comparison_count - rank) * raw_p_value, 1.0)\n        running_maximum = max(running_maximum, candidate)\n        adjusted_p_values.append(running_maximum)\n    paired = zip(ordered, adjusted_p_values, strict=True)\n    return tuple((name, adjusted_p_value) for (name, _), adjusted_p_value in paired)\n''')

          # Artifact paths use the dataset enum, never a free token.
          paths = Path('src/fedsira/artifacts/paths.py')
          content = paths.read_text()
          content = content.replace('from fedsira.domain.enums import ArtifactFamily, ArtifactPathScope', 'from fedsira.domain.enums import ArtifactFamily, ArtifactPathScope, DatasetId')
          content = content.replace('from fedsira.domain.records import CanonicalToken, ExperimentName', 'from fedsira.domain.records import ExperimentName')
          content = content.replace('def prepared_evidence_root(dataset: CanonicalToken) -> Path:', 'def prepared_evidence_root(dataset: DatasetId) -> Path:')
          paths.write_text(content)

          # Straight semantic replacements where the old token had exactly one meaning.
          type_map = {
              'src/fedsira/attacks/transform.py': ('CanonicalToken', 'SampleId'),
              'src/fedsira/evaluation/aggregation.py': ('CanonicalToken', 'SampleId'),
              'src/fedsira/evaluation/metrics.py': ('CanonicalToken', 'DatasetClassToken'),
              'src/fedsira/evaluation/validation.py': ('CanonicalToken', 'DatasetClassToken'),
              'src/fedsira/learning/anchor.py': ('CanonicalToken', 'SampleId'),
              'src/fedsira/learning/federated.py': ('CanonicalToken', 'SampleId'),
              'src/fedsira/learning/training.py': ('CanonicalToken', 'SampleId'),
              'src/fedsira/learning/post_reference.py': ('CanonicalToken', 'SampleId'),
              'src/fedsira/experiments/registry.py': ('CanonicalToken', 'ExperimentName'),
              'src/fedsira/runtime/environment.py': ('CanonicalToken', 'EnvironmentText'),
              'src/fedsira/runtime/logging.py': ('CanonicalToken', 'RuntimeComponentName'),
          }
          for path, (old, new) in type_map.items():
              edit(path, [(old, new)])

          # Baseline participation is a protocol fact, not a generic boolean.
          edit('src/fedsira/baselines/registry.py', [
              ('BooleanFlag', 'BaselineFullParticipationAllowed'),
          ])

          # Opening types distinguish sample identity, attack eligibility, and decisions.
          opening = Path('src/fedsira/protocol/opening.py')
          content = opening.read_text()
          content = content.replace('    BooleanFlag,\n    CanonicalToken,', '    AttackCarrierRequired,\n    CandidateFreeOpeningPredicate,\n    SampleId,\n    ScreenDomainDecision,')
          content = content.replace('sample_id: CanonicalToken', 'sample_id: SampleId')
          content = content.replace('Mapping[CanonicalToken, FoldIndex]', 'Mapping[SampleId, FoldIndex]')
          content = content.replace('requires_attack_carrier: BooleanFlag', 'requires_attack_carrier: AttackCarrierRequired')
          content = content.replace(') -> BooleanFlag:', ') -> ScreenDomainDecision:')
          content = content.replace('def candidate_free_screen_domain_predicate(\n    anchor_target_f1: MetricResult, capability_claim_config: CapabilityClaimConfig\n) -> ScreenDomainDecision:', 'def candidate_free_screen_domain_predicate(\n    anchor_target_f1: MetricResult, capability_claim_config: CapabilityClaimConfig\n) -> CandidateFreeOpeningPredicate:')
          opening.write_text(content)

          # Admission metadata and predicates have distinct meanings.
          admission = Path('src/fedsira/protocol/admission.py')
          content = admission.read_text()
          content = content.replace('    BooleanFlag,\n    CanonicalToken,', '    CellPhaseIdentity,\n    FinalGateArtifactValid,\n    GitCommit,\n    InvariantChecksPassed,\n    PluralityActive,\n    ScientificCellSemanticKey,')
          content = content.replace('final_gate_artifact_is_valid: BooleanFlag', 'final_gate_artifact_is_valid: FinalGateArtifactValid')
          content = content.replace('is_plurality_active: BooleanFlag', 'is_plurality_active: PluralityActive')
          content = content.replace('no_invariant_failure: BooleanFlag', 'no_invariant_failure: InvariantChecksPassed')
          content = content.replace('semantic_cell_key: CanonicalToken', 'semantic_cell_key: ScientificCellSemanticKey')
          content = content.replace('cell_phase_identity: CanonicalToken', 'cell_phase_identity: CellPhaseIdentity')
          content = content.replace('repository_commit: CanonicalToken', 'repository_commit: GitCommit')
          admission.write_text(content)

          # Provenance carries typed identities and typed change predicates.
          provenance = Path('src/fedsira/artifacts/provenance.py')
          provenance.write_text('''from fedsira.domain.enums import ProvenanceValidationOutcome\nfrom fedsira.domain.records import (\n    ArtifactDigest,\n    ArtifactInvalidated,\n    CreationContext,\n    DatasetSplitUpstreamChanged,\n    EnvironmentRecord,\n    GitCommit,\n    ProducerCodeOrRuntimeChanged,\n    ProvenancePayloadStale,\n    ScientificConfigurationChanged,\n    ScientificConfigurationSubset,\n    FrozenDomainModel,\n)\n\n\nclass ProvenanceRecord(FrozenDomainModel):\n    scientific_configuration_subset: ScientificConfigurationSubset\n    dataset_split_upstream_identities: tuple[ArtifactDigest, ...]\n    producer_component_fingerprint: ArtifactDigest\n    external_dependency_fingerprint: ArtifactDigest\n    repository_commit: GitCommit\n    dependency_lock_identity: ArtifactDigest\n    environment_record: EnvironmentRecord\n    creation_context: CreationContext\n\n\ndef classify_provenance_change(\n    payload_partial_or_stale: ProvenancePayloadStale,\n    scientific_configuration_changed: ScientificConfigurationChanged,\n    dataset_split_upstream_changed: DatasetSplitUpstreamChanged,\n    producer_code_or_runtime_changed: ProducerCodeOrRuntimeChanged,\n) -> ProvenanceValidationOutcome:\n    if payload_partial_or_stale:\n        return ProvenanceValidationOutcome.PARTIAL_OR_STALE_PAYLOAD\n    if scientific_configuration_changed:\n        return ProvenanceValidationOutcome.SCIENTIFIC_CONFIGURATION_MISMATCH\n    if dataset_split_upstream_changed:\n        return ProvenanceValidationOutcome.DATASET_SPLIT_UPSTREAM_MISMATCH\n    if producer_code_or_runtime_changed:\n        return ProvenanceValidationOutcome.PRODUCER_CODE_RUNTIME_MISMATCH\n    return ProvenanceValidationOutcome.NON_MATERIAL_CHANGE\n\n\ndef outcome_invalidates_artifact(outcome: ProvenanceValidationOutcome) -> ArtifactInvalidated:\n    return outcome is not ProvenanceValidationOutcome.NON_MATERIAL_CHANGE\n''')

          # CICIoT2023 uses distinct label/column/path/value contracts.
          cic = Path('src/fedsira/datasets/ciciot2023/preprocessing.py')
          content = cic.read_text()
          content = content.replace(
              'from fedsira.domain.records import ArtifactDigest, CanonicalToken, NonNegativeInt, PositiveInt',
              'from fedsira.domain.records import (\n    ArtifactDigest,\n    DatasetClassToken,\n    DatasetColumnName,\n    NonNegativeInt,\n    PositiveInt,\n    PredictorCountMatchesOfficial,\n    PredictorValue,\n    RelativePathText,\n)'
          )
          content = content.replace('relative_path: CanonicalToken', 'relative_path: RelativePathText')
          content = content.replace('canonical_label: CanonicalToken', 'canonical_label: DatasetClassToken')
          content = content.replace('class_registry: tuple[CanonicalToken, ...]', 'class_registry: tuple[DatasetClassToken, ...]')
          content = content.replace('predictor_columns: tuple[CanonicalToken, ...]', 'predictor_columns: tuple[DatasetColumnName, ...]')
          content = content.replace('predictor_count_matches_official: bool', 'predictor_count_matches_official: PredictorCountMatchesOfficial')
          content = content.replace('features: tuple[float, ...]', 'features: tuple[PredictorValue, ...]')
          content = content.replace('normalized_relative_csv_path: CanonicalToken', 'normalized_relative_csv_path: RelativePathText')
          content = content.replace('header: tuple[CanonicalToken, ...]', 'header: tuple[DatasetColumnName, ...]')
          content = content.replace('label_column: CanonicalToken', 'label_column: DatasetColumnName')
          content = content.replace('row_identifier_columns: frozenset[CanonicalToken]', 'row_identifier_columns: frozenset[DatasetColumnName]')
          content = content.replace(') -> tuple[CanonicalToken, ...]:', ') -> tuple[DatasetColumnName, ...]:')
          content = content.replace('predictor_columns: tuple[CanonicalToken, ...]', 'predictor_columns: tuple[DatasetColumnName, ...]')
          cic.write_text(content)

          # N-BaIoT preprocessing tokens are columns, domains, relative paths, or view identities.
          nb = Path('src/fedsira/datasets/nbaiot/preprocessing.py')
          content = nb.read_text()
          content = content.replace('CanonicalToken,', 'DatasetColumnName,')
          content = content.replace('tuple[CanonicalToken, ...]', 'tuple[DatasetColumnName, ...]')
          content = content.replace('view_key: CanonicalToken', 'view_key: DatasetColumnName')
          content = content.replace('domain_hash_token: CanonicalToken', 'domain_hash_token: DomainId')
          content = content.replace('normalized_relative_csv_path: CanonicalToken', 'normalized_relative_csv_path: RelativePathText')
          # ensure any newly referenced semantic names are imported
          marker = '    DatasetColumnName,\n'
          if marker in content:
              for name in ('DomainId', 'RelativePathText'):
                  if f'    {name},\n' not in content:
                      content = content.replace(marker, marker + f'    {name},\n', 1)
          nb.write_text(content)

          # Tests that imported the deleted generic token for feature fixtures use FeatureName.
          test_real = Path('tests/unit/experiments/test_real_evidence.py')
          if test_real.exists():
              test_real.write_text(test_real.read_text().replace('CanonicalToken', 'FeatureName'))
          PY
          uv run ruff format src/fedsira/domain/records.py src/fedsira/analysis/statistics.py src/fedsira/artifacts/paths.py src/fedsira/artifacts/provenance.py src/fedsira/attacks/transform.py src/fedsira/baselines/registry.py src/fedsira/datasets/ciciot2023/preprocessing.py src/fedsira/datasets/nbaiot/preprocessing.py src/fedsira/evaluation/aggregation.py src/fedsira/evaluation/metrics.py src/fedsira/evaluation/validation.py src/fedsira/experiments/registry.py src/fedsira/learning src/fedsira/protocol/admission.py src/fedsira/protocol/opening.py src/fedsira/runtime/environment.py src/fedsira/runtime/logging.py tests/unit/experiments/test_real_evidence.py
          uv run ruff check --fix src/fedsira/domain/records.py src/fedsira/analysis/statistics.py src/fedsira/artifacts/paths.py src/fedsira/artifacts/provenance.py src/fedsira/attacks/transform.py src/fedsira/baselines/registry.py src/fedsira/datasets/ciciot2023/preprocessing.py src/fedsira/datasets/nbaiot/preprocessing.py src/fedsira/evaluation/aggregation.py src/fedsira/evaluation/metrics.py src/fedsira/evaluation/validation.py src/fedsira/experiments/registry.py src/fedsira/learning src/fedsira/protocol/admission.py src/fedsira/protocol/opening.py src/fedsira/runtime/environment.py src/fedsira/runtime/logging.py tests/unit/experiments/test_real_evidence.py
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          git commit -m "refactor: migrate generic tokens to semantic contracts"
          git push
