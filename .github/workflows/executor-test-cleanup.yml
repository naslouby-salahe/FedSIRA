name: executor-test-cleanup

on:
  push:
    branches:
      - refactor/roadmap-completion
    paths:
      - .github/workflows/executor-test-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
      - uses: astral-sh/setup-uv@v6
      - name: Finish constructor migration and format affected test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/integration/experiments/test_protocol_executor_real_evidence.py")
          text = path.read_text().replace("prepared_root=prepared_root", "primary_prepared_root=prepared_root")
          path.write_text(text)
          PY
          uvx ruff==0.7.4 format tests/integration/experiments/test_protocol_executor_real_evidence.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/experiments/test_protocol_executor_real_evidence.py
          git commit -m "Finish ProtocolCellExecutor test migration"
          git push origin HEAD:refactor/roadmap-completion
