name: roadmap-module-migration

on:
  push:
    branches:
      - refactor/roadmap-completion
    paths:
      - .github/workflows/roadmap-module-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
      - name: Rewrite authoritative preprocessing imports and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/fedsira/experiments/real_evidence.py"): (
                  "from fedsira.datasets.nbaiot.materialization import view_parquet_path",
                  "from fedsira.datasets.nbaiot.preprocessing import view_parquet_path",
              ),
              Path("tests/integration/experiments/test_protocol_executor_real_evidence.py"): (
                  "from fedsira.datasets.nbaiot.materialization import materialize_nbaiot_prepared_views\n"
                  "from fedsira.datasets.nbaiot.preprocessing import NBAIOT_PRIMARY_PREDICTOR_COUNT",
                  "from fedsira.datasets.nbaiot.preprocessing import (\n"
                  "    NBAIOT_PRIMARY_PREDICTOR_COUNT,\n"
                  "    materialize_nbaiot_prepared_views,\n"
                  ")",
              ),
              Path("tests/unit/experiments/test_real_evidence.py"): (
                  "from fedsira.datasets.nbaiot.materialization import materialize_nbaiot_prepared_views\n"
                  "from fedsira.datasets.nbaiot.preprocessing import NBAIOT_PRIMARY_PREDICTOR_COUNT",
                  "from fedsira.datasets.nbaiot.preprocessing import (\n"
                  "    NBAIOT_PRIMARY_PREDICTOR_COUNT,\n"
                  "    materialize_nbaiot_prepared_views,\n"
                  ")",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected migration source not found in {path}")
              path.write_text(text.replace(old, new, 1))

          target = Path("tests/unit/datasets/nbaiot/test_preprocessing.py")
          source = Path("tests/unit/datasets/nbaiot/test_materialization.py")
          target_text = target.read_text()
          source_text = source.read_text()

          target_text = target_text.replace("import pytest\n", "import pandas\nimport pytest\n", 1)
          target_text = target_text.replace(
              "from fedsira.datasets.common import DatasetExclusionReason, Role",
              "from fedsira.datasets.common import ROLE_HASH_TOKEN, DatasetExclusionReason, Role",
              1,
          )
          target_text = target_text.replace(
              "from fedsira.datasets.nbaiot.preprocessing import (\n"
              "    NBAIOT_PRIMARY_PREDICTOR_COUNT,",
              "from fedsira.datasets.nbaiot.acquisition import DiscoveredCsvFile\n"
              "from fedsira.datasets.nbaiot.preprocessing import (\n"
              "    NBAIOT_PRIMARY_PREDICTOR_COUNT,\n"
              "    PreparedView,",
              1,
          )
          target_text = target_text.replace(
              "    assign_stream_roles_and_sample_ids,",
              "    assign_stream_roles_and_sample_ids,\n"
              "    materialize_nbaiot_prepared_views,",
              1,
          )
          target_text = target_text.replace(
              "    validate_predictor_schema,\n)",
              "    validate_predictor_schema,\n"
              "    view_parquet_path,\n"
              ")",
              1,
          )
          target_text = target_text.replace(
              "from fedsira.datasets.nbaiot.schema import NBAIOT_TRIGGER_FEATURES, NBaiotClass",
              "from fedsira.datasets.nbaiot.schema import (\n"
              "    NBAIOT_DOMAIN_HASH_TOKEN,\n"
              "    NBAIOT_TRIGGER_FEATURES,\n"
              "    NBaiotClass,\n"
              "    NBaiotDomain,\n"
              ")",
              1,
          )

          marker = "TRIGGER_FEATURES = "
          source_index = source_text.index(marker)
          target.write_text(target_text.rstrip() + "\n\n\n" + source_text[source_index:])
          source.unlink()
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fedsira/experiments/real_evidence.py tests/integration/experiments/test_protocol_executor_real_evidence.py tests/unit/experiments/test_real_evidence.py tests/unit/datasets/nbaiot/test_preprocessing.py tests/unit/datasets/nbaiot/test_materialization.py
          git commit -m "Migrate N-BaIoT callers to roadmap preprocessing module"
          git push origin HEAD:refactor/roadmap-completion
