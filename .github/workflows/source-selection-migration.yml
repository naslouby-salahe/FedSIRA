name: source-selection-migration

on:
  push:
    branches:
      - refactor/roadmap-completion

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Fold source selection into claim opening'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Migrate source selection ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/fedsira/experiments/protocol_executor.py'),
              Path('tests/unit/protocol/test_source_selection.py'),
              Path('tests/integration/experiments/test_protocol_executor_real_evidence.py'),
          ]
          for path in paths:
              text = path.read_text()
              text = text.replace(
                  'from fedsira.protocol.source_selection import select_source_domain, source_selection_order',
                  'from fedsira.protocol.opening import select_source_domain, source_selection_order',
              )
              text = text.replace('requires_gafgyt_udp_carrier=', 'requires_attack_carrier=')
              text = text.replace('domains_with_gafgyt_udp=', 'domains_with_attack_carrier=')
              path.write_text(text)

          executor = paths[0]
          text = executor.read_text().replace(
              'source_order = source_selection_order(\n        derive_uint32(',
              'source_order = source_selection_order(\n        NBAIOT_DOMAIN_ORDER,\n        derive_uint32(',
          )
          executor.write_text(text)

          unit_test = paths[1]
          text = unit_test.read_text().replace(
              'source_selection_order(42)', 'source_selection_order(NBAIOT_DOMAIN_ORDER, 42)'
          ).replace(
              'source_selection_order(7)', 'source_selection_order(NBAIOT_DOMAIN_ORDER, 7)'
          )
          unit_test.write_text(text)

          integration = paths[2]
          text = integration.read_text().replace(
              'source_selection_order(', 'source_selection_order(NBAIOT_DOMAIN_ORDER, '
          )
          integration.write_text(text)

          Path('src/fedsira/protocol/source_selection.py').unlink(missing_ok=True)
          PY
          python -m pip install --quiet ruff==0.7.4
          ruff format src/fedsira/experiments/protocol_executor.py tests/unit/protocol/test_source_selection.py tests/integration/experiments/test_protocol_executor_real_evidence.py
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fold source selection into claim opening'
          git pull --rebase origin refactor/roadmap-completion
          git push origin HEAD:refactor/roadmap-completion
