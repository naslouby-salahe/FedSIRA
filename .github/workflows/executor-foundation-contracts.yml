name: executor-foundation-contracts

on:
  push:
    branches:
      - refactor/roadmap-completion
    paths:
      - .github/workflows/executor-foundation-contracts.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - name: Type executor foundation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          records = Path('src/fedsira/domain/records.py')
          text = records.read_text()
          marker = 'AdequateFinalGateDomainCount = NonNegativeInt\n'
          additions = 'AdequateFinalGateDomainCount = NonNegativeInt\nPreparedScreenTargetCount = NonNegativeInt\nPreparedReproductionTargetCount = NonNegativeInt\nPreparedSupportedReplayCount = NonNegativeInt\nRequiredReproductionRowCount = PositiveInt\n'
          if 'PreparedScreenTargetCount = NonNegativeInt' not in text:
              text = text.replace(marker, additions)
          records.write_text(text)

          path = Path('src/fedsira/experiments/protocol_executor.py')
          text = path.read_text()
          text = text.replace(
              'from fedsira.domain.records import CanonicalToken, MasterSeed, SeedBundle\n',
              'from fedsira.domain.records import (\n    AdequateFinalGateDomainCount,\n    ArtifactDigest,\n    CapabilityContractSatisfied,\n    ClaimId,\n    DatasetClassToken,\n    DomainId,\n    FrozenDomainModel,\n    MasterSeed,\n    ModuleName,\n    PreparedReproductionTargetCount,\n    PreparedScreenTargetCount,\n    PreparedSupportedReplayCount,\n    RequiredReproductionRowCount,\n    SeedBundle,\n)\n',
          )
          text = text.replace(') -> tuple[CanonicalToken, ...]:', ') -> tuple[ModuleName, ...]:', 1)
          old = '@dataclass(frozen=True)\nclass PreparedEvidenceCounts:\n    screen_target_count: int\n    reproduction_target_count: int\n    reproduction_supported_count: int\n    final_gate_adequate_domain_count: int\n\n\n@dataclass(frozen=True)\nclass OpeningIdentity:\n    claim_identity: str\n    contract_passes: bool\n'
          new = 'class PreparedEvidenceCounts(FrozenDomainModel):\n    screen_target_count: PreparedScreenTargetCount\n    reproduction_target_count: PreparedReproductionTargetCount\n    reproduction_supported_count: PreparedSupportedReplayCount\n    final_gate_adequate_domain_count: AdequateFinalGateDomainCount\n\n\nclass OpeningIdentity(FrozenDomainModel):\n    claim_identity: ClaimId\n    contract_passes: CapabilityContractSatisfied\n'
          if old not in text:
              raise SystemExit('executor foundation record block not found')
          text = text.replace(old, new)
          text = text.replace('prepared_root: Path, target_class_token: CanonicalToken', 'prepared_root: Path, target_class_token: DatasetClassToken')
          text = text.replace('final_gate_target_domains: set[CanonicalToken] = set()', 'final_gate_target_domains: set[DomainId] = set()')
          text = text.replace(') -> int:\n    if cell.method == RESOLVED_FEDSIRA_CORE_METHOD', ') -> RequiredReproductionRowCount:\n    if cell.method == RESOLVED_FEDSIRA_CORE_METHOD', 1)
          text = text.replace('def _commitment_digest(reproducer_domain: NBaiotDomain, master_seed: MasterSeed) -> str:', 'def _commitment_digest(\n    reproducer_domain: NBaiotDomain, master_seed: MasterSeed\n) -> ArtifactDigest:')
          path.write_text(text)
          PY
          uv run ruff check src/fedsira/domain/records.py src/fedsira/experiments/protocol_executor.py --fix || true
          uv run ruff format src/fedsira/domain/records.py src/fedsira/experiments/protocol_executor.py
          rm .github/workflows/executor-foundation-contracts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: type executor foundation contracts'
          git push origin HEAD:refactor/roadmap-completion
