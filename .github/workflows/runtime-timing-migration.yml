name: runtime-timing-migration

on:
  push:
    branches:
      - refactor/roadmap-completion

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Complete runtime timing ownership migration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/roadmap-completion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Move timing ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path('.').rglob('*.py'):
              if '.venv' in path.parts:
                  continue
              text = path.read_text()
              updated = text.replace('fedsira.runtime.telemetry', 'fedsira.runtime.timing')
              if updated != text:
                  path.write_text(updated)
          old_test = Path('tests/unit/runtime/test_telemetry.py')
          timing_test = Path('tests/unit/runtime/test_timing.py')
          if old_test.exists():
              timing_test.write_text(timing_test.read_text() + '\n' + old_test.read_text())
              old_test.unlink()
          Path('src/fedsira/runtime/telemetry.py').unlink(missing_ok=True)
          PY
          python -m pip install --quiet ruff==0.7.4
          ruff format src/fedsira/runtime/timing.py src/fedsira/experiments/protocol_executor.py tests/unit/runtime/test_timing.py
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete runtime timing ownership migration'
          git pull --rebase origin refactor/roadmap-completion
          git push origin HEAD:refactor/roadmap-completion
